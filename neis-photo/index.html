        const IconArrowUp = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 15l7-7 7 7" /></svg>;
        const IconArrowDown = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>;
        const IconHelp = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        const IconEye = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>;

        // ==========================================
        // 나이스 규격 헬퍼 및 캔버스 렌더러
        // ==========================================
        const NEIS_SPECS = {
            standard: { label: "나이스 4세대 표준 (354 × 472 px, 3:4)", width: 354, height: 472 },
            compact: { label: "나이스 구버전/소형 (300 × 400 px, 3:4)", width: 300, height: 400 },
            highRes: { label: "고해상도 인쇄용 (600 × 800 px, 3:4)", width: 600, height: 800 }
        };

        // 이진 탐색으로 100KB~190KB 최적 품질 JPEG 생성 함수
        async function optimizeJpegQuality(canvas, targetMinKb = 120, targetMaxKb = 190) {
            const minBytes = targetMinKb * 1024;
            const maxBytes = targetMaxKb * 1024;

            // 최고 품질 시도
            let blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.98));
            if (!blob) return null;
            if (blob.size <= maxBytes) {
                return blob; // 원본이 190KB 이하이면 그대로 최상위 화질 유지
            }

            // 190KB를 초과하는 경우 이진 탐색 (최대 5회)
            let low = 0.2;
            let high = 0.95;
            let bestBlob = blob;

            for (let i = 0; i < 5; i++) {
                const mid = (low + high) / 2;
                const currentBlob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', mid));
                if (!currentBlob) break;

                if (currentBlob.size > maxBytes) {
                    high = mid;
                } else {
                    bestBlob = currentBlob;
                    if (currentBlob.size >= minBytes) {
                        break; // 120KB ~ 190KB 완벽한 범위 진입
                    }
                    low = mid;
                }
            }

            return bestBlob;
        }

        // 이미지 객체 로드 헬퍼
        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        // 공통 정규화 캔버스 크롭 로직 (단일 및 일괄 처리에서 100% 동일한 결과 보장)
        async function renderCroppedImage({ imageObj, cropSettings, spec = NEIS_SPECS.standard }) {
            const canvas = document.createElement('canvas');
            canvas.width = spec.width;
            canvas.height = spec.height;
            const ctx = canvas.getContext('2d');

            // 1. 흰색 배경
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. 필터 적용 (밝기 및 대비)
            const brightness = cropSettings.brightness || 100;
            const contrast = cropSettings.contrast || 100;
            ctx.filter = `brightness(${brightness}%) contrast(${contrast}%)`;

            // 3. 변환 매트릭스 계산
            const { normX = 0, normY = 0, scale = 1, rotation = 0, flipH = false } = cropSettings;

            // 이미지 회전 고려한 실질 가로/세로
            const isRotated90 = (rotation % 180 !== 0);
            const naturalW = isRotated90 ? imageObj.naturalHeight : imageObj.naturalWidth;
            const naturalH = isRotated90 ? imageObj.naturalWidth : imageObj.naturalHeight;

            // 크롭 박스를 채우는 기본 배율 (Cover 기준)
            const baseScale = Math.max(canvas.width / naturalW, canvas.height / naturalH);
            const finalScale = baseScale * scale;

            const drawW = imageObj.naturalWidth * finalScale;
            const drawH = imageObj.naturalHeight * finalScale;

            ctx.save();
            // 캔버스 중심 + 사용자가 이동한 정규화 오프셋 적용
            ctx.translate(canvas.width / 2 + normX * canvas.width, canvas.height / 2 + normY * canvas.height);
            ctx.rotate((rotation * Math.PI) / 180);
            if (flipH) ctx.scale(-1, 1);

            ctx.drawImage(imageObj, -drawW / 2, -drawH / 2, drawW, drawH);
            ctx.restore();

            // 4. 용량 최적화 (120~190KB)
            const blob = await optimizeJpegQuality(canvas);
            const url = URL.createObjectURL(blob);
            return { blob, url, sizeKb: Math.round(blob.size / 1024) };
        }

        // ==========================================
        // 메인 App 컴포넌트
        // ==========================================
        function App() {
            // 학생 사진 데이터 목록
            const [images, setImages] = useState([]);
            const [selectedIndex, setSelectedIndex] = useState(null);
            const [dragActive, setDragActive] = useState(false);
            
            // 일괄/압축 진행 상태
            const [isZipping, setIsZipping] = useState(false);
            const [zipProgress, setZipProgress] = useState(0);
            const [isBatchProcessing, setIsBatchProcessing] = useState(false);
            const [batchProgress, setBatchProgress] = useState(0);

            // 모달 상태
            const [showBulkInput, setShowBulkInput] = useState(false);
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [showOverviewModal, setShowOverviewModal] = useState(false);
            const [showHelpModal, setShowHelpModal] = useState(false);
            const [showRuleModal, setShowRuleModal] = useState(false);

            // 명렬표 입력 문자열
            const [bulkText, setBulkText] = useState("");

            // 학교/학급 설정 & 파일명 서식 옵션
            const [config, setConfig] = useState({
                grade: "",
                classNum: "",
                namingFormat: "name_num", // 'name_num': 홍길동(1), 'num2_name': 01_홍길동, 'num_name': 1_홍길동, 'full_id_name': 10301_홍길동, 'custom': 직접입력
                customPattern: "{num2}_{name}",
                specKey: "standard", // standard, compact, highRes
                autoTwoDigitNum: true // 1번 -> 01번
            });

            // 파일명 생성 헬퍼
            const formatFilename = useCallback((name, number, idx = 0) => {
                const sName = (name || `학생${idx + 1}`).trim();
                const rawNum = String(number || (idx + 1)).trim();
                const num2 = rawNum.length === 1 ? `0${rawNum}` : rawNum;
                const grade = config.grade ? String(config.grade) : "1";
                const classNum = config.classNum ? (String(config.classNum).padStart(2, "0")) : "01";
                const fullId = `${grade}${classNum}${num2}`;

                switch (config.namingFormat) {
                    case "name_num": // 홍길동(1).jpg 또는 홍길동(01).jpg
                        return `${sName}(${config.autoTwoDigitNum ? num2 : rawNum}).jpg`;
                    case "num2_name": // 01_홍길동.jpg
                        return `${num2}_${sName}.jpg`;
                    case "num_name": // 1_홍길동.jpg
                        return `${rawNum}_${sName}.jpg`;
                    case "full_id_name": // 10301_홍길동.jpg
                        return `${fullId}_${sName}.jpg`;
                    case "name_only": // 홍길동.jpg
                        return `${sName}.jpg`;
                    case "custom": // 템플릿 치환
                        return config.customPattern
                            .replace(/{name}/g, sName)
                            .replace(/{num}/g, rawNum)
                            .replace(/{num2}/g, num2)
                            .replace(/{grade}/g, grade)
                            .replace(/{class}/g, classNum)
                            .replace(/{fullid}/g, fullId) + ".jpg";
                    default:
                        return `${sName}(${rawNum}).jpg`;
                }
            }, [config]);

            // 파일 추가 처리 (자연스러운 번호 정렬 지원)
            const handleFiles = (files) => {
                const fileArray = Array.from(files).filter(f => f.type.startsWith('image/'));
                if (fileArray.length === 0) {
                    alert("지원되는 이미지 파일이 없습니다.");
                    return;
                }

                // 파일명 자연 정렬 (1.jpg, 2.jpg ... 10.jpg 올바른 순서)
                fileArray.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

                const startIdx = images.length;
                const newImages = fileArray.map((file, i) => {
                    const assignedNum = startIdx + i + 1;
                    // 파일명에서 이름/번호 자동 추출 시도 (예: 1_홍길동.jpg 또는 홍길동(1).jpg)
                    const cleanName = file.name.replace(/\.[^/.]+$/, "");
                    const numMatch = cleanName.match(/\d+/);
                    const koreanMatch = cleanName.match(/[가-힣]{2,4}/);

                    return {
                        id: Math.random().toString(36).substr(2, 9),
                        file: file,
                        preview: URL.createObjectURL(file),
                        name: koreanMatch ? koreanMatch[0] : "",
                        number: numMatch ? String(numMatch[0]) : String(assignedNum),
                        processedBlob: null,
                        processedUrl: null,
                        sizeKb: 0,
                        isDone: false,
                        // 기본 크롭 세팅: 화면 크기와 무관한 정규화 값
                        cropSettings: {
                            normX: 0,
                            normY: 0,
                            scale: 1.0,
                            rotation: 0,
                            flipH: false,
                            brightness: 100,
                            contrast: 100
                        }
                    };
                });

                setImages(prev => [...prev, ...newImages]);
                if (selectedIndex === null && newImages.length > 0) {
                    setSelectedIndex(startIdx);
                }
            };

            const handleDrop = (e) => {
                e.preventDefault();
                e.stopPropagation();
                setDragActive(false);
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    handleFiles(e.dataTransfer.files);
                }
            };

            // 스마트 명렬표 파서 (엑셀 복사/붙여넣기, 쉼표, 띄어쓰기 등 완벽 처리)
            const applyBulkData = () => {
                if (!bulkText.trim()) return;

                const lines = bulkText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const parsed = [];

                lines.forEach((line, idx) => {
                    // 탭이나 콤마, 공백 등으로 분리
                    const parts = line.split(/[\t,;]+/).map(p => p.trim()).filter(Boolean);
                    
                    let number = "";
                    let name = "";

                    if (parts.length >= 2) {
                        // 1열 번호, 2열 이름이거나 그 반대인 경우 탐지
                        if (/^\d+$/.test(parts[0])) {
                            number = parts[0];
                            name = parts[1];
                        } else if (/^\d+$/.test(parts[1])) {
                            name = parts[0];
                            number = parts[1];
                        } else {
                            name = parts[0];
                            number = String(idx + 1);
                        }
                    } else {
                        // 한 줄에 합쳐진 경우 (예: "1번 홍길동", "1 홍길동", "홍길동")
                        const numMatch = line.match(/\d+/);
                        const nameMatch = line.match(/[가-힣a-zA-Z]{2,15}/);
                        number = numMatch ? numMatch[0] : String(idx + 1);
                        name = nameMatch ? nameMatch[0] : line.replace(/\d+/g, '').trim();
                    }

                    if (name || number) {
                        parsed.push({ number, name });
                    }
                });

                if (parsed.length === 0) {
                    alert("인식된 명렬표 데이터가 없습니다.");
                    return;
                }

                setImages(prev => {
                    const next = [...prev];
                    parsed.forEach((item, i) => {
                        if (next[i]) {
                            next[i] = {
                                ...next[i],
                                name: item.name || next[i].name,
                                number: item.number || next[i].number
                            };
                        }
                    });
                    return next;
                });

                alert(`${parsed.length}명의 명렬표 정보가 성공적으로 적용되었습니다.`);
                setShowBulkInput(false);
                setBulkText("");
            };

            // 전체 학생 1클릭 일괄 자르기 (One-Click Batch Crop All)
            const handleBatchProcessAll = async (baseCropSettings) => {
                if (images.length === 0) return;
                
                const confirmed = confirm(
                    `현재 보고 있는 사진의 위치와 크기 설정을 바탕으로,\n전체 ${images.length}장의 사진을 한 번에 자동 크롭하시겠습니까?\n\n(완료 즉시 일괄 다운로드가 가능해집니다.)`
                );
                if (!confirmed) return;

                setIsBatchProcessing(true);
                setBatchProgress(0);

                const spec = NEIS_SPECS[config.specKey] || NEIS_SPECS.standard;
                const updated = [...images];

                for (let i = 0; i < updated.length; i++) {
                    const item = updated[i];
                    try {
                        const imgObj = await loadImage(item.preview);
                        const cropSettings = baseCropSettings || item.cropSettings;
                        const result = await renderCroppedImage({ imageObj: imgObj, cropSettings, spec });

                        // 이전 URL 메모리 해제
                        if (item.processedUrl) URL.revokeObjectURL(item.processedUrl);

                        updated[i] = {
                            ...item,
                            cropSettings: { ...cropSettings },
                            processedBlob: result.blob,
                            processedUrl: result.url,
                            sizeKb: result.sizeKb,
                            isDone: true
                        };
                    } catch (err) {
                        console.error(`Index ${i} 처리 실패:`, err);
                    }
                    setBatchProgress(Math.round(((i + 1) / updated.length) * 100));
                }

                setImages(updated);
                setIsBatchProcessing(false);
                alert(`전체 ${updated.length}장의 사진이 성공적으로 일괄 편집되었습니다!\n상단의 [전체 다운로드 (ZIP)]을 눌러 저장하세요.`);
            };

            // 개별 사진 처리 완료 핸들러
            const handleSingleComplete = (index, processedBlob, processedUrl, sizeKb, cropSettings) => {
                setImages(prev => {
                    const next = [...prev];
                    if (next[index].processedUrl) {
                        URL.revokeObjectURL(next[index].processedUrl);
                    }
                    next[index] = {
                        ...next[index],
                        processedBlob,
                        processedUrl,
                        sizeKb,
                        cropSettings,
                        isDone: true
                    };
                    return next;
                });

                // 자동으로 다음 학생으로 부드럽게 이동
                if (index < images.length - 1) {
                    setSelectedIndex(index + 1);
                } else {
                    alert("마지막 학생까지 사진 저장이 완료되었습니다! 전체 ZIP 다운로드를 진행하세요.");
                }
            };

            // ZIP 일괄 다운로드
            const handleDownloadZip = async () => {
                const completed = images.filter(img => img.isDone && img.processedBlob);
                if (completed.length === 0) {
                    alert("완료된 사진이 없습니다. 먼저 사진을 저장하거나 [전체 일괄 자르기]를 실행하세요.");
                    return;
                }

                setIsZipping(true);
                setZipProgress(0);

                const zip = new JSZip();
                const folderName = config.grade && config.classNum 
                    ? `${config.grade}학년_${config.classNum}반_나이스사진`
                    : "나이스_학생사진_일괄등록용";
                
                const folder = zip.folder(folderName);

                completed.forEach((img, i) => {
                    const filename = formatFilename(img.name, img.number, i);
                    folder.file(filename, img.processedBlob);
                });

                try {
                    const content = await zip.generateAsync({ 
                        type: "blob", 
                        compression: "DEFLATE",
                        compressionOptions: { level: 6 } 
                    }, (metadata) => {
                        setZipProgress(Math.round(metadata.percent));
                    });

                    const url = URL.createObjectURL(content);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${folderName}.zip`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (err) {
                    console.error("ZIP 생성 실패:", err);
                    alert("ZIP 파일 생성 중 오류가 발생했습니다.");
                } finally {
                    setIsZipping(false);
                    setZipProgress(0);
                }
            };

            // 목록 순서 변경 (위로 이동, 아래로 이동)
            const moveItem = (index, direction, e) => {
                e.stopPropagation();
                const targetIndex = index + direction;
                if (targetIndex < 0 || targetIndex >= images.length) return;

                setImages(prev => {
                    const copy = [...prev];
                    const temp = copy[index];
                    copy[index] = copy[targetIndex];
                    copy[targetIndex] = temp;
                    return copy;
                });

                if (selectedIndex === index) {
                    setSelectedIndex(targetIndex);
                } else if (selectedIndex === targetIndex) {
                    setSelectedIndex(index);
                }
            };

            // 개별 삭제
            const handleDelete = (index, e) => {
                e.stopPropagation();
                if (!confirm(`${index + 1}번 항목을 목록에서 삭제하시겠습니까?`)) return;

                setImages(prev => {
                    const target = prev[index];
                    if (target.preview) URL.revokeObjectURL(target.preview);
                    if (target.processedUrl) URL.revokeObjectURL(target.processedUrl);
                    return prev.filter((_, i) => i !== index);
                });

                if (selectedIndex === index) {
                    setSelectedIndex(images.length > 1 ? Math.max(0, index - 1) : null);
                } else if (selectedIndex > index) {
                    setSelectedIndex(selectedIndex - 1);
                }
            };

            // 번호 재정렬 (1번부터 순차 재부여)
            const renumberAll = () => {
                if (images.length === 0) return;
                if (!confirm("모든 사진의 번호를 현재 목록 순서대로 1번부터 다시 매기시겠습니까?")) return;
                setImages(prev => prev.map((img, i) => ({
                    ...img,
                    number: String(i + 1)
                })));
            };

            const completedCount = images.filter(img => img.isDone).length;

            return (
                <div className="flex flex-col h-screen bg-slate-100">
                    {/* 상단 네비게이션 헤더 */}
                    <header className="bg-indigo-700 text-white px-5 py-3 flex items-center justify-between shadow-md z-30 select-none">
                        <div className="flex items-center gap-3">
                            <div className="w-9 h-9 rounded-lg bg-indigo-500/40 flex items-center justify-center font-black text-xl shadow-inner">
                                📸
                            </div>
                            <div>
                                <div className="flex items-center gap-2">
                                    <h1 className="text-lg font-bold tracking-tight">나이스(NEIS) 사진 업로드 도우미</h1>
                                    <span className="bg-indigo-500/60 text-[11px] font-semibold px-2 py-0.5 rounded-full border border-indigo-400/40">
                                        Pro 2.0
                                    </span>
                                </div>
                                <p className="text-xs text-indigo-200">
                                    {NEIS_SPECS[config.specKey].width}×{NEIS_SPECS[config.specKey].height}px • 3:4 규격 • 120~190KB 최적압축 • 사진·이름은 브라우저에서 처리
                                </p>
                            </div>
                        </div>

                        {/* 우측 도구 버튼들 */}
                        <div className="flex items-center gap-2">
                            <button
                                onClick={() => setShowRuleModal(true)}
                                className="flex items-center gap-1.5 bg-amber-400 hover:bg-amber-300 text-slate-900 text-xs font-bold px-3 py-2 rounded-lg shadow-sm transition active:scale-95"
                                title="초등 2~5학년은 매년 교체 의무 없음! 교육부 기재요령 규정 안내"
                            >
                                <span>📋</span>
                                <span className="hidden sm:inline">생기부 사진 규정 (꿀팁)</span>
                                <span className="sm:hidden">생기부규정</span>
                            </button>

                            {images.length > 0 && (
                                <button
                                    onClick={() => setShowOverviewModal(true)}
                                    className="flex items-center gap-1.5 bg-indigo-600/70 hover:bg-indigo-600 text-white text-xs font-semibold px-3 py-2 rounded-lg border border-indigo-400/30 transition shadow-sm"
                                    title="전체 사진을 한눈에 바둑판으로 검토합니다"
                                >
                                    <IconGrid />
                                    모아보기 ({completedCount}/{images.length})
                                </button>
                            )}

                            <button
                                onClick={() => setShowSettingsModal(true)}
                                className="flex items-center gap-1.5 bg-indigo-600/70 hover:bg-indigo-600 text-white text-xs font-semibold px-3 py-2 rounded-lg border border-indigo-400/30 transition shadow-sm"
                                title="파일명 서식 및 학급 정보 설정"
                            >
                                <IconSettings />
                                파일명/규격 설정
                            </button>

                            <button
                                onClick={() => setShowHelpModal(true)}
                                className="p-2 text-indigo-200 hover:text-white rounded-lg hover:bg-indigo-600/50 transition"
                                title="사용 도움말 및 단축키 안내"
                            >
                                <IconHelp />
                            </button>

                            {/* ZIP 다운로드 버튼 */}
                            {completedCount > 0 && (
                                <button
                                    onClick={handleDownloadZip}
                                    disabled={isZipping}
                                    className="flex items-center gap-2 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold text-xs px-4 py-2 rounded-lg shadow transition disabled:opacity-50"
                                >
                                    <IconDownload />
                                    {isZipping ? `압축 중 (${zipProgress}%)` : `ZIP 전체 다운로드 (${completedCount})`}
                                </button>
                            )}
                        </div>
                    </header>

                    {/* 메인 2단 레이아웃 */}
                    <div className="flex flex-1 overflow-hidden">
                        {/* 좌측 사이드바: 사진 및 명렬표 목록 */}
                        <div className="w-80 md:w-88 lg:w-96 bg-white border-r border-slate-200 flex flex-col shadow-sm z-20">
                            {/* 상단 액션 바 */}
                            <div className="p-3 bg-slate-50 border-b border-slate-200 flex flex-col gap-2">
                                {/* 생기부 기재요령 꿀팁 배너 */}
                                <div 
                                    onClick={() => setShowRuleModal(true)}
                                    className="p-2 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-lg cursor-pointer transition flex items-center justify-between text-[11px] text-amber-900 group"
                                    title="클릭하여 교육부 학교생활기록부 사진 교체 기준을 확인하세요"
                                >
                                    <div className="flex items-center gap-1.5 truncate">
                                        <span className="text-amber-600 font-bold">💡 꿀팁:</span>
                                        <span className="truncate">초등 2~5학년은 매년 교체 안 해도 됩니다!</span>
                                    </div>
                                    <span className="font-bold text-amber-700 underline text-[10px] flex-shrink-0 group-hover:translate-x-0.5 transition-transform">규정보기 ➔</span>
                                </div>

                                <div className="grid grid-cols-2 gap-2">
                                    <button
                                        onClick={() => setShowBulkInput(!showBulkInput)}
                                        className="flex items-center justify-center gap-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-2 px-3 rounded-lg border border-indigo-200 text-xs font-bold transition"
                                    >
                                        <IconList />
                                        명렬표 붙여넣기
                                    </button>
                                    <label className="flex items-center justify-center gap-1.5 bg-white hover:bg-slate-100 text-slate-700 py-2 px-3 rounded-lg border border-slate-300 text-xs font-bold cursor-pointer transition shadow-sm">
                                        <IconUpload />
                                        사진 추가 (+단축)
                                        <input
                                            type="file"
                                            multiple
                                            accept="image/*"
                                            className="hidden"
                                            onChange={(e) => handleFiles(e.target.files)}
                                        />
                                    </label>
                                </div>

                                {showBulkInput && (
                                    <div className="p-3 bg-white rounded-lg border border-indigo-200 shadow-sm animate-modal">
                                        <div className="flex justify-between items-center mb-1.5">
                                            <span className="text-xs font-bold text-slate-700">엑셀/한글 명렬표 붙여넣기</span>
                                            <button onClick={() => setShowBulkInput(false)} className="text-slate-400 hover:text-slate-600 text-xs">✕</button>
                                        </div>
                                        <p className="text-[11px] text-slate-500 mb-2 leading-relaxed">
                                            엑셀에서 <strong>[번호]</strong>와 <strong>[이름]</strong> 열을 복사해서 붙여넣으세요. 이름만 있어도 자동으로 번호가 매겨집니다.
                                        </p>
                                        <textarea
                                            value={bulkText}
                                            onChange={(e) => setBulkText(e.target.value)}
                                            placeholder={"예시:\n1\t홍길동\n2\t김영희\n3\t이철수"}
                                            className="w-full h-32 text-xs p-2.5 font-mono border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none mb-2 resize-none"
                                        />
                                        <button
                                            onClick={applyBulkData}
                                            className="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2 rounded-md transition shadow"
                                        >
                                            명렬표 순서대로 적용하기
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* 드래그 앤 드롭 업로드 영역 */}
                            {images.length === 0 ? (
                                <div
                                    onDragEnter={(e) => { e.preventDefault(); setDragActive(true); }}
                                    onDragOver={(e) => { e.preventDefault(); setDragActive(true); }}
                                    onDragLeave={(e) => { e.preventDefault(); setDragActive(false); }}
                                    onDrop={handleDrop}
                                    className={`flex-1 m-4 border-2 border-dashed rounded-xl flex flex-col items-center justify-center p-6 text-center transition ${
                                        dragActive ? 'border-indigo-500 bg-indigo-50' : 'border-slate-300 bg-slate-50 hover:bg-slate-100/60'
                                    }`}
                                >
                                    <div className="w-14 h-14 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center mb-3">
                                        <IconUpload />
                                    </div>
                                    <h3 className="text-sm font-bold text-slate-700 mb-1">학생 사진 파일들을 드래그하세요</h3>
                                    <p className="text-xs text-slate-500 mb-4 leading-relaxed">
                                        스마트폰, 디카로 촬영한 사진을<br/>폴더째로 한 번에 끌어다 놓으세요.
                                    </p>
                                    <label className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-lg cursor-pointer transition shadow">
                                        내 컴퓨터에서 파일 선택
                                        <input
                                            type="file"
                                            multiple
                                            accept="image/*"
                                            className="hidden"
                                            onChange={(e) => handleFiles(e.target.files)}
                                        />
                                    </label>
                                </div>
                            ) : (
                                <>
                                    {/* 목록 통계 및 제어 */}
                                    <div className="px-4 py-2 bg-slate-100/70 border-b border-slate-200 flex items-center justify-between text-xs text-slate-600">
                                        <span>
                                            학생 <strong>{images.length}명</strong> 중 
                                            <span className="text-emerald-600 font-bold ml-1">{completedCount}명 완료</span>
                                        </span>
                                        <div className="flex gap-2">
                                            <button
                                                onClick={renumberAll}
                                                className="text-[11px] text-slate-500 hover:text-indigo-600"
                                                title="현재 목록 순서대로 1번부터 다시 매김"
                                            >
                                                번호재정렬
                                            </button>
                                            <button
                                                onClick={() => {
                                                    if (confirm("정말 모든 사진을 비우시겠습니까?")) {
                                                        images.forEach(img => {
                                                            URL.revokeObjectURL(img.preview);
                                                            if (img.processedUrl) URL.revokeObjectURL(img.processedUrl);
                                                        });
                                                        setImages([]);
                                                        setSelectedIndex(null);
                                                    }
                                                }}
                                                className="text-[11px] text-rose-500 hover:text-rose-700"
                                            >
                                                전체비우기
                                            </button>
                                        </div>
                                    </div>

                                    {/* 학생 사진 목록 리스트 */}
                                    <div className="flex-1 overflow-y-auto p-2 space-y-1.5">
                                        {images.map((img, idx) => {
                                            const isSelected = selectedIndex === idx;
                                            const displayName = img.name || `학생 ${idx + 1}`;
                                            const displayFilename = formatFilename(img.name, img.number, idx);

                                            return (
                                                <div
                                                    key={img.id}
                                                    onClick={() => setSelectedIndex(idx)}
                                                    className={`group relative flex items-center p-2 rounded-xl border transition cursor-pointer ${
                                                        isSelected
                                                            ? 'bg-indigo-50/90 border-indigo-400 ring-2 ring-indigo-400/30'
                                                            : 'bg-white border-slate-200 hover:border-indigo-200 hover:bg-slate-50'
                                                    }`}
                                                >
                                                    {/* 사진 썸네일 */}
                                                    <div className="relative w-11 h-14 rounded-md bg-slate-200 overflow-hidden flex-shrink-0 mr-3 border border-slate-300">
                                                        <img
                                                            src={img.processedUrl || img.preview}
                                                            alt={displayName}
                                                            className="w-full h-full object-cover"
                                                        />
                                                        {img.isDone && (
                                                            <div className="absolute inset-0 bg-emerald-600/30 flex items-center justify-center">
                                                                <span className="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-sm">
                                                                    <IconCheck />
                                                                </span>
                                                            </div>
                                                        )}
                                                        <span className="absolute top-0 left-0 bg-black/60 text-white text-[9px] font-bold px-1 rounded-br">
                                                            {idx + 1}
                                                        </span>
                                                    </div>

                                                    {/* 학생 정보 */}
                                                    <div className="flex-1 min-w-0 pr-1">
                                                        <div className="flex items-center gap-1.5">
                                                            <span className="font-bold text-sm text-slate-800 truncate">
                                                                {img.name ? img.name : <span className="text-slate-400 font-normal italic">이름 미입력</span>}
                                                            </span>
                                                            <span className="text-xs font-semibold px-1.5 py-0.2 bg-slate-100 text-slate-600 rounded">
                                                                {img.number ? `${img.number}번` : `${idx + 1}번`}
                                                            </span>
                                                        </div>
                                                        <div className="text-[11px] text-slate-400 truncate mt-0.5">
                                                            {displayFilename}
                                                        </div>
                                                        {img.isDone && (
                                                            <div className="text-[10px] text-emerald-600 font-medium flex items-center gap-1 mt-0.5">
                                                                <span>완료</span>
                                                                <span>• {img.sizeKb}KB</span>
                                                            </div>
                                                        )}
                                                    </div>

                                                    {/* 순서 조정 및 삭제 액션 버튼 */}
                                                    <div className="flex flex-col gap-0.5 opacity-60 group-hover:opacity-100 transition">
                                                        <div className="flex items-center">
                                                            <button
                                                                disabled={idx === 0}
                                                                onClick={(e) => moveItem(idx, -1, e)}
                                                                className="p-1 text-slate-400 hover:text-indigo-600 disabled:opacity-20 hover:bg-slate-200/60 rounded"
                                                                title="위로 이동"
                                                            >
                                                                <IconArrowUp />
                                                            </button>
                                                            <button
                                                                disabled={idx === images.length - 1}
                                                                onClick={(e) => moveItem(idx, 1, e)}
                                                                className="p-1 text-slate-400 hover:text-indigo-600 disabled:opacity-20 hover:bg-slate-200/60 rounded"
                                                                title="아래로 이동"
                                                            >
                                                                <IconArrowDown />
                                                            </button>
                                                        </div>
                                                        <button
                                                            onClick={(e) => handleDelete(idx, e)}
                                                            className="p-1 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded text-center flex justify-center"
                                                            title="삭제"
                                                        >
                                                            <IconTrash />
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </>
                            )}
                        </div>

                        {/* 우측 메인 작업 영역: 이미지 에디터 */}
                        <div className="flex-1 bg-slate-900 flex flex-col relative overflow-hidden">
                            {selectedIndex !== null && images[selectedIndex] ? (
                                <ImageEditor
                                    key={images[selectedIndex].id}
                                    image={images[selectedIndex]}
                                    index={selectedIndex}
                                    totalCount={images.length}
                                    spec={NEIS_SPECS[config.specKey]}
                                    computedFilename={formatFilename(images[selectedIndex].name, images[selectedIndex].number, selectedIndex)}
                                    onUpdateStudent={(field, val) => {
                                        setImages(prev => {
                                            const next = [...prev];
                                            next[selectedIndex] = { ...next[selectedIndex], [field]: val };
                                            return next;
                                        });
                                    }}
                                    onComplete={(blob, url, sizeKb, settings) => {
                                        handleSingleComplete(selectedIndex, blob, url, sizeKb, settings);
                                    }}
                                    onBatchProcessAll={handleBatchProcessAll}
                                    onSelectPrev={() => setSelectedIndex(prev => Math.max(0, prev - 1))}
                                    onSelectNext={() => setSelectedIndex(prev => Math.min(images.length - 1, prev + 1))}
                                />
                            ) : (
                                <div className="flex-1 flex flex-col items-center justify-center text-slate-400 p-8 text-center select-none">
                                    <div className="w-20 h-20 rounded-2xl bg-slate-800 flex items-center justify-center text-slate-500 mb-4 border border-slate-700">
                                        <IconUpload />
                                    </div>
                                    <h2 className="text-xl font-bold text-slate-200 mb-2">선택된 사진이 없습니다</h2>
                                    <p className="text-sm text-slate-400 max-w-sm mb-6 leading-relaxed">
                                        왼쪽 점선 박스에 학생들의 사진 파일들을 끌어다 놓거나, [사진 추가] 버튼을 눌러주세요.
                                    </p>
                                </div>
                            )}

                            {/* 일괄 처리 중 로딩 오버레이 */}
                            {isBatchProcessing && (
                                <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center text-white">
                                    <div className="w-16 h-16 border-4 border-indigo-400 border-t-transparent rounded-full animate-spin mb-4"></div>
                                    <h3 className="text-lg font-bold">전체 사진 일괄 자동 크롭 중...</h3>
                                    <p className="text-xs text-slate-300 mt-1 mb-4">나이스 권장 3:4 규격 및 용량 최적화 적용 중 ({batchProgress}%)</p>
                                    <div className="w-64 bg-slate-700 h-2.5 rounded-full overflow-hidden">
                                        <div className="bg-indigo-500 h-full transition-all duration-200" style={{ width: `${batchProgress}%` }}></div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* 설정 모달 */}
                    {showSettingsModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl animate-modal border border-slate-200">
                                <div className="flex justify-between items-center mb-4 pb-2 border-b">
                                    <h2 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                        <IconSettings />
                                        나이스 사진 규격 및 파일명 설정
                                    </h2>
                                    <button onClick={() => setShowSettingsModal(false)} className="text-slate-400 hover:text-slate-600 text-sm font-bold">✕</button>
                                </div>

                                <div className="space-y-4 text-xs">
                                    {/* 학년/반 설정 */}
                                    <div className="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">학년</label>
                                            <input
                                                type="number"
                                                value={config.grade}

        // ==========================================
        // 우측 메인 이미지 에디터 컴포넌트
        // ==========================================
        function ImageEditor({
            image,
            index,
            totalCount,
            spec,
            computedFilename,
            onUpdateStudent,
            onComplete,
            onBatchProcessAll,
            onSelectPrev,
            onSelectNext
        }) {
            const containerRef = useRef(null);
            const cropBoxRef = useRef(null);

            // 로컬 편집 상태 (부모의 cropSettings 계승)
            const [cropSettings, setCropSettings] = useState(() => ({
                normX: image.cropSettings?.normX ?? 0,
                normY: image.cropSettings?.normY ?? 0,
                scale: image.cropSettings?.scale ?? 1.0,
                rotation: image.cropSettings?.rotation ?? 0,
                flipH: image.cropSettings?.flipH ?? false,
                brightness: image.cropSettings?.brightness ?? 100,
                contrast: image.cropSettings?.contrast ?? 100
            }));

            // 가이드라인 오버레이 표시 여부
            const [showGuideLines, setShowGuideLines] = useState(true);
            const [isSaving, setIsSaving] = useState(false);

            // 드래그 상태
            const [isDragging, setIsDragging] = useState(false);
            const dragStartRef = useRef({ mouseX: 0, mouseY: 0, startNormX: 0, startNormY: 0 });

            // 원본 이미지 로드
            const [imgElement, setImgElement] = useState(null);
            useEffect(() => {
                let active = true;
                loadImage(image.preview).then(img => {
                    if (active) setImgElement(img);
                });
                return () => { active = false; };
            }, [image.preview]);

            // 크롭 박스 크기 측정 (3:4 종횡비 유지)
            const [boxDim, setBoxDim] = useState({ w: 300, h: 400 });
            useEffect(() => {
                const updateDimensions = () => {
                    if (!containerRef.current) return;
                    const contW = containerRef.current.clientWidth;
                    const contH = containerRef.current.clientHeight;

                    // 여백 고려 80% 높이 기준 3:4 비율
                    const targetH = contH * 0.78;
                    const targetW = targetH * (3 / 4);

                    setBoxDim({ w: targetW, h: targetH });
                };

                updateDimensions();
                window.addEventListener('resize', updateDimensions);
                return () => window.removeEventListener('resize', updateDimensions);
            }, []);

            // 드래그 인터랙션 (마우스 / 터치)
            const handlePointerDown = (e) => {
                if (e.button !== 0 && e.type !== 'touchstart') return; // 좌클릭만
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                setIsDragging(true);
                dragStartRef.current = {
                    mouseX: clientX,
                    mouseY: clientY,
                    startNormX: cropSettings.normX,
                    startNormY: cropSettings.normY
                };
            };

            const handlePointerMove = (e) => {
                if (!isDragging) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const dx = clientX - dragStartRef.current.mouseX;
                const dy = clientY - dragStartRef.current.mouseY;

                // 크롭 박스 너비/높이에 대한 정규화 오프셋 비율 계산
                const dNormX = dx / boxDim.w;
                const dNormY = dy / boxDim.h;

                setCropSettings(prev => ({
                    ...prev,
                    normX: dragStartRef.current.startNormX + dNormX,
                    normY: dragStartRef.current.startNormY + dNormY
                }));
            };

            const handlePointerUp = () => setIsDragging(false);

            // 마우스 휠 줌 (확대/축소)
            const handleWheel = (e) => {
                e.preventDefault();
                const delta = e.deltaY < 0 ? 0.05 : -0.05;
                setCropSettings(prev => ({
                    ...prev,
                    scale: Math.max(0.4, Math.min(3.5, Number((prev.scale + delta).toFixed(2))))
                }));
            };

            // 회전
            const rotate90 = () => {
                setCropSettings(prev => ({
                    ...prev,
                    rotation: (prev.rotation + 90) % 360
                }));
            };

            // 좌우 반전
            const toggleFlip = () => {
                setCropSettings(prev => ({
                    ...prev,
                    flipH: !prev.flipH
                }));
            };

            // 리셋
            const resetSettings = () => {
                setCropSettings({
                    normX: 0,
                    normY: 0,
                    scale: 1.0,
                    rotation: 0,
                    flipH: false,
                    brightness: 100,
                    contrast: 100
                });
            };

            // 저장 실행
            const handleExecuteSave = async () => {
                if (!imgElement) return;
                setIsSaving(true);
                try {
                    const result = await renderCroppedImage({
                        imageObj: imgElement,
                        cropSettings,
                        spec
                    });
                    onComplete(result.blob, result.url, result.sizeKb, cropSettings);
                } catch (err) {
                    console.error("저장 실패:", err);
                    alert("사진 처리 중 오류가 발생했습니다.");
                } finally {
                    setIsSaving(false);
                }
            };

            // 키보드 단축키 핸들러
            useEffect(() => {
                const onKeyDown = (e) => {
                    // input/textarea 포커스 중에는 무시
                    if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

                    if (e.code === 'Space' || e.code === 'Enter') {
                        e.preventDefault();
                        handleExecuteSave();
                    } else if (e.code === 'ArrowLeft') {
                        e.preventDefault();
                        onSelectPrev();
                    } else if (e.code === 'ArrowRight') {
                        e.preventDefault();
                        onSelectNext();
                    } else if (e.key === 'r' || e.key === 'R') {
                        e.preventDefault();
                        rotate90();
                    }
                };

                window.addEventListener('keydown', onKeyDown);
                return () => window.removeEventListener('keydown', onKeyDown);
            }, [imgElement, cropSettings, spec]);

            // 화면상에 표시될 이미지의 크기 및 위치 계산
            const previewStyle = useMemo(() => {
                if (!imgElement) return {};

                const isRot90 = (cropSettings.rotation % 180 !== 0);
                const naturalW = isRot90 ? imgElement.naturalHeight : imgElement.naturalWidth;
                const naturalH = isRot90 ? imgElement.naturalWidth : imgElement.naturalHeight;

                const baseScale = Math.max(boxDim.w / naturalW, boxDim.h / naturalH);
                const finalScale = baseScale * cropSettings.scale;

                const renderedW = imgElement.naturalWidth * finalScale;
                const renderedH = imgElement.naturalHeight * finalScale;

                // 중심점 + 오프셋
                const offsetX = cropSettings.normX * boxDim.w;
                const offsetY = cropSettings.normY * boxDim.h;

                return {
                    width: `${renderedW}px`,
                    height: `${renderedH}px`,
                    transform: `translate(${offsetX}px, ${offsetY}px) rotate(${cropSettings.rotation}deg) scaleX(${cropSettings.flipH ? -1 : 1})`,
                    filter: `brightness(${cropSettings.brightness}%) contrast(${cropSettings.contrast}%)`,
                    cursor: isDragging ? 'grabbing' : 'grab',
                    transition: isDragging ? 'none' : 'transform 0.08s ease-out'
                };
            }, [imgElement, boxDim, cropSettings, isDragging]);

            return (
                <div className="flex flex-col h-full bg-slate-900 select-none">
                    {/* 상단 이름 및 번호 편집 바 */}
                    <div className="bg-slate-800 border-b border-slate-700/80 px-6 py-3 flex flex-wrap items-center justify-between gap-4 z-20">
                        <div className="flex items-center gap-3">
                            <span className="w-7 h-7 rounded-full bg-indigo-600 text-white font-bold text-xs flex items-center justify-center">
                                {index + 1}
                            </span>
                            <div className="flex items-center gap-2">
                                <label className="text-xs font-bold text-slate-400">이름:</label>
                                <input
                                    type="text"
                                    value={image.name}
                                    onChange={(e) => onUpdateStudent('name', e.target.value)}
                                    placeholder="학생 이름"
                                    className="bg-slate-900 border border-slate-600 rounded-lg px-2.5 py-1 text-sm font-bold text-white focus:ring-2 focus:ring-indigo-400 focus:outline-none w-28"
                                />
                            </div>
                            <div className="flex items-center gap-2">
                                <label className="text-xs font-bold text-slate-400">번호:</label>
                                <input
                                    type="text"
                                    value={image.number}
                                    onChange={(e) => onUpdateStudent('number', e.target.value)}
                                    placeholder="번호"
                                    className="bg-slate-900 border border-slate-600 rounded-lg px-2.5 py-1 text-sm font-bold text-white focus:ring-2 focus:ring-indigo-400 focus:outline-none w-16 text-center"
                                />
                            </div>
                        </div>

                        {/* 예상 파일명 및 네비게이션 */}
                        <div className="flex items-center gap-4 text-xs">
                            <div className="hidden lg:flex items-center gap-1.5 text-slate-400">
                                <span>생성 파일명:</span>
                                <span className="font-mono font-bold text-indigo-300 bg-slate-900 px-2 py-0.5 rounded border border-slate-700">
                                    {computedFilename}
                                </span>
                            </div>

                            <div className="flex items-center gap-1 bg-slate-900 p-0.5 rounded-lg border border-slate-700">
                                <button
                                    onClick={onSelectPrev}
                                    disabled={index === 0}
                                    className="px-2.5 py-1 rounded text-slate-300 hover:text-white hover:bg-slate-800 disabled:opacity-30 transition font-bold"
                                    title="이전 학생 (←)"
                                >
                                    ◀ 이전
                                </button>
                                <span className="text-slate-500 text-[11px] px-1 font-mono">{index + 1} / {totalCount}</span>
                                <button
                                    onClick={onSelectNext}
                                    disabled={index === totalCount - 1}
                                    className="px-2.5 py-1 rounded text-slate-300 hover:text-white hover:bg-slate-800 disabled:opacity-30 transition font-bold"
                                    title="다음 학생 (→)"
                                >
                                    다음 ▶
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* 중앙 캔버스 뷰포트 드래그 에어리어 */}
                    <div
                        ref={containerRef}
                        onWheel={handleWheel}
                        onMouseDown={handlePointerDown}
                        onMouseMove={handlePointerMove}
                        onMouseUp={handlePointerUp}
                        onMouseLeave={handlePointerUp}
                        onTouchStart={handlePointerDown}
                        onTouchMove={handlePointerMove}
                        onTouchEnd={handlePointerUp}
                        className="flex-1 relative flex items-center justify-center overflow-hidden bg-slate-950"
                    >
                        {/* 크롭 박스 및 오버레이 */}
                        <div
                            ref={cropBoxRef}
                            style={{ width: `${boxDim.w}px`, height: `${boxDim.h}px` }}
                            className="relative flex items-center justify-center crop-shadow border-2 border-indigo-400/90 rounded-xs pointer-events-none z-10"
                        >
                            {/* 나이스 표준 얼굴 가이드라인 오버레이 */}
                            {showGuideLines && (
                                <div className="absolute inset-0 pointer-events-none opacity-85">
                                    {/* 십자선 */}
                                    <div className="absolute top-1/2 left-0 w-full h-px bg-indigo-300/40"></div>
                                    <div className="absolute left-1/2 top-0 h-full w-px bg-indigo-300/40"></div>

                                    {/* 얼굴 타원 영역 (정수리~턱선) */}
                                    <div className="absolute top-[16%] left-1/2 -translate-x-1/2 w-[54%] h-[56%] border-2 border-dashed border-amber-300 rounded-[50%/48%]">
                                        {/* 눈높이 기준선 */}
                                        <div className="absolute top-[42%] left-2 right-2 h-px border-t border-dotted border-amber-300/70"></div>
                                        <span className="absolute top-[38%] left-1 -translate-x-full text-[9px] text-amber-300/80 pr-1">눈</span>
                                        <span className="absolute -top-4 left-1/2 -translate-x-1/2 text-[9px] text-amber-300/90 font-bold">정수리선</span>
                                        <span className="absolute -bottom-4 left-1/2 -translate-x-1/2 text-[9px] text-amber-300/90 font-bold">턱선</span>
                                    </div>

                                    {/* 어깨 라인 유도 곡선 */}
                                    <div className="absolute bottom-0 left-1/2 -translate-x-1/2 w-[92%] h-[20%] border-t-2 border-dashed border-indigo-300/40 rounded-t-[100%]"></div>
                                </div>
                            )}

                            {/* 우측 상단 규격 안내 배지 */}
                            <div className="absolute -top-7 right-0 text-[10px] text-indigo-300 bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700">
                                나이스 규격 3:4
                            </div>
                        </div>

                        {/* 백그라운드 렌더링 이미지 */}
                        {imgElement && (
                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                <img
                                    src={image.preview}
                                    alt="Crop target"
                                    style={previewStyle}
                                    className="max-w-none select-none"
                                    draggable={false}
                                />
                            </div>
                        )}

                        {/* 플로팅 컨트롤 툴바 (화면 하단) */}
                        <div className="absolute bottom-5 left-1/2 -translate-x-1/2 bg-slate-800/90 backdrop-blur-md px-4 py-2 rounded-2xl flex items-center gap-4 text-white z-20 shadow-2xl border border-slate-700/80">
                            {/* 확대/축소 슬라이더 */}
                            <div className="flex items-center gap-2 text-xs">
                                <span className="text-slate-400">축소</span>
                                <input
                                    type="range"
                                    min="0.5"
                                    max="3.0"
                                    step="0.05"
                                    value={cropSettings.scale}
                                    onChange={(e) => setCropSettings({ ...cropSettings, scale: parseFloat(e.target.value) })}
                                    className="w-24 md:w-32 accent-indigo-500"
                                />
                                <span className="text-slate-400">확대</span>
                                <span className="font-mono text-[11px] text-indigo-300 w-9 text-right">
                                    {Math.round(cropSettings.scale * 100)}%
                                </span>
                            </div>

                            <div className="w-px h-5 bg-slate-700"></div>

                            {/* 회전 / 반전 / 리셋 */}
                            <div className="flex items-center gap-1.5">
                                <button
                                    onClick={rotate90}
                                    className="p-1.5 hover:bg-slate-700 rounded-lg text-slate-300 hover:text-white transition"
                                    title="시계방향 90도 회전 (R)"
                                >
                                    <IconRotateCw />
                                </button>
                                <button
                                    onClick={toggleFlip}
                                    className="p-1.5 hover:bg-slate-700 rounded-lg text-slate-300 hover:text-white transition"
                                    title="좌우 반전"
                                >
                                    <IconFlip />
                                </button>
                                <button
                                    onClick={() => setShowGuideLines(!showGuideLines)}
                                    className={`p-1.5 rounded-lg transition ${showGuideLines ? 'text-amber-400 bg-slate-700' : 'text-slate-400 hover:bg-slate-700'}`}
                                    title="얼굴 맞춤 가이드라인 토글"
                                >
                                    <IconEye />
                                </button>
                                <button
                                    onClick={resetSettings}
                                    className="px-2 py-1 text-[11px] text-slate-400 hover:text-white hover:bg-slate-700 rounded transition"
                                    title="위치 및 배율 처음대로"
                                >
                                    초기화
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* 하단 최종 액션 바 */}
                    <div className="bg-slate-800 border-t border-slate-700 px-6 py-3.5 flex items-center justify-between z-20">
                        {/* 일괄 적용 스마트 버튼 */}
                        <div className="flex items-center gap-2">
                            <button
                                onClick={() => onBatchProcessAll(cropSettings)}
                                className="flex items-center gap-1.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-lg transition active:scale-95"
                                title="첫 번째 학생 위치 그대로 나머지 모든 사진을 1초 만에 자동 자르고 완료 처리합니다"
                            >
                                <IconSparkles />
                                ⚡ 현재 설정으로 전체 일괄 자르기
                            </button>
                            <span className="hidden md:inline text-[11px] text-slate-400">
                                (비슷한 구도로 찍은 학급 사진을 1초 만에 전원 완성)
                            </span>
                        </div>

                        {/* 개별 저장 / 다운로드 버튼 */}
                        <div className="flex items-center gap-2">
                            {image.isDone && image.processedUrl && (
                                <a
                                    href={image.processedUrl}
                                    download={computedFilename}
                                    className="flex items-center gap-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold px-3 py-2 rounded-xl border border-slate-600 transition"
                                >
                                    <IconDownload />
                                    개별 다운로드
                                </a>
                            )}

                            <button
                                onClick={handleExecuteSave}
                                disabled={isSaving}
                                className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs font-bold px-5 py-2 rounded-xl shadow-lg transition disabled:opacity-50"
                            >
                                <IconCheck />
                                {isSaving ? "저장 중..." : "저장하고 다음 학생 (Space)"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // 애플리케이션 시작
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
